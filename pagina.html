<style>

:root{--bg:#000;--surface:#0a0a0a;--elev:#141414;--hover:#171717;--line:#242424;--line2:#333;--tx:#ededed;--tx2:#a1a1a1;--tx3:#8f8f8f;--bubble:#1f1f1f;

button{border:0;background:none;cursor:pointer;border-radius:8px}

*{scrollbar-width:thin;scrollbar-color:#2e2e2e transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2e2e2e;border-radius:8px}::-webkit-scrollbar-button{display:none}

.st.run{background:var(--tx);animation:pulse 1.4s ease-in-out infinite}.st.att{background:var(--warn)}.st.err{background:var(--no)}

.nav button:hover,.nav button.on{background:var(--hover);color:var(--tx)}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--line);flex:none}
.top .ttl{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);border:1px solid var(--line);border-radius:99px;padding:2px 10px}

/* ---------- chat */

.col{max-width:740px;margin:auto}
.u{background:var(--bubble);border-radius:18px;padding:9px 16px;margin:22px 0 14px auto;width:fit-content;max-width:85%;white-space:pre-wrap;word-break:break-word}

.steps>.h .ic{transition:transform .15s}.steps.open>.h .ic.ch{transform:rotate(90deg)}
.steps .l{margin:2px 0 0 7px;padding-left:16px;border-left:1px solid var(--line)}

.a{padding:4px 0 6px;word-break:break-word;font-size:15px;line-height:1.65}
.a p{margin:0 0 12px}.a ul,.a ol{margin:0 0 12px;padding-left:22px}.a li{margin:4px 0}.a li>ul,.a li>ol{margin:4px 0 0}
.a .acts{display:flex;gap:2px;margin-top:2px}.a .acts button{padding:4px 8px;font-size:12.5px;color:var(--tx2);display:flex;gap:6px;align-items:center}.a .acts button:hover{color:var(--tx);background:var(--hover)}
pre,code{font:12.5px/1.55 var(--mono)}
pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:10px 0}
code{background:var(--elev);padding:1px 6px;border-radius:5px}
.ver{margin:2px 0 6px;font-size:12.5px;color:var(--tx3)}.ver .vh{display:flex;gap:6px;align-items:center}.ver .vd{margin:2px 0 0 22px;color:var(--tx2)}.ver.ok .vh{color:var(--ok)}.ver.warn .vh{color:var(--warn)}.ver.no .vh{color:var(--no)}
.err-box{border:1px solid #e5484d44;border-radius:10px;padding:10px 14px;margin:6px 0;color:#f2a0a3}
.hello{text-align:center;padding:12vh 0 8px}
.hello h1{font-size:32px;line-height:1.15;font-weight:600;margin:0 0 6px;letter-spacing:-.02em}.hello p{color:var(--tx2);margin:0 0 26px}
.ex{max-width:740px;margin:auto;text-align:left;display:grid;gap:8px}
.ex button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:12px 14px;border-radius:12px;text-align:left;color:var(--tx2)}
.ex button:hover{background:var(--hover);color:var(--tx);border-color:var(--line2)}
/* ---------- barra di scrittura */
.composer{padding:6px 16px calc(14px + env(safe-area-inset-bottom));flex:none}
.box{max-width:740px;margin:auto;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:12px 12px 10px 16px;transition:border-color .15s}
.box:focus-within{border-color:#8f8f8f}
textarea{width:100%;background:none;border:0;outline:0;resize:none;max-height:180px;padding:2px 0;line-height:1.5;font-size:15px}
textarea::placeholder{color:var(--tx2);opacity:.75}
.bar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{appearance:auto;background:var(--elev);color:var(--tx2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px;min-height:30px;max-width:190px;cursor:pointer}

.alleg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}.alleg:empty{display:none}

.ch img{width:36px;height:36px;object-fit:cover;border-radius:6px;flex:none}.ch .ic{margin:0 4px;color:var(--tx3)}.ch .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ch .x{color:var(--tx3);padding:2px 6px;border-radius:6px;font-size:14px;min-height:0}.ch .x:hover{color:var(--tx);background:var(--line)}.ch.carico{opacity:.6}
.ua{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:22px 0 4px auto}.ua .u{margin:0 0 8px auto}

.att-f{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:6px 10px;color:var(--tx2);text-decoration:none;font-size:13px}.att-f:hover{color:var(--tx)}
.clip{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);flex:none}.clip:hover{background:var(--hover);color:var(--tx)}.clip+.mic{margin-left:0}
.box.drag{border-color:#8f8f8f;background:#0f0f0f}
.mic{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);flex:none}.mic:hover{background:var(--hover);color:var(--tx)}.mic.rec{background:var(--no);color:#fff;animation:pulse 1.2s ease-in-out infinite}.mic:disabled{opacity:.4}

/* ---------- consumi */
.pag{flex:1;overflow:auto;padding:28px 20px 40px}
.pag .in{max-width:760px;margin:auto}

.sec{border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}

.reset{display:flex;align-items:baseline;gap:14px;padding:16px;flex-wrap:wrap}

.tr{display:grid;grid-template-columns:minmax(0,1.5fr) 110px minmax(80px,1fr) 110px;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.tr:first-of-type{border-top:0}

.tr .nome{font:13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.meter{height:6px;background:var(--elev);border-radius:99px;overflow:hidden}

.stato{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);justify-content:flex-end}
.stato.no{color:var(--no)}.stato.ok{color:var(--ok)}
.chart{width:100%;height:auto;display:block;padding:8px 12px 4px}
.chart text{font:11px system-ui;fill:var(--tx3)}.chart .tick{text-anchor:end}.chart .gl{stroke:var(--line);stroke-width:1}

}

<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const DESC={generico:'Generico: usa tutti gli strumenti',sviluppatore:'Sviluppatore: legge il codice, modifica poco, esegue i test',ricercatore:'Ricercatore: cerca sul web, legge le fonti, scrive un report',revisore:'Revisore: legge i file e scrive REVISIONE.md'};
const DESCMODO={chiedi:'Conferme: ogni comando, modifica, click e installazione chiede il tuo ok.',comodo:'Conferme: solo le azioni rischiose.',tutto:'Conferme: mai (sudo e simili restano bloccati).'};
const ESEMPI=[['file','Riassumi i file del workspace in un indice'],['search','Cerca sul web le novità su Python 3.14 e scrivi report.md'],['terminal','Rivedi il codice nel workspace e segnala i bug']];
const ICN={screenshot:'image',finestre:'window',stato_pc:'cpu',apri:'globe',controlla_input:'mouse',list_dir:'folder',read_file:'file',write_file:'pencil',edit_file:'pencil',delete_file:'trash',run_shell:'terminal',fetch_url:'globe',web_search:'search',delega_agenti:'users',git:'git'};
function ic(n){const s=document.createElementNS(NS,'svg');s.setAttribute('class','ic');const u=document.createElementNS(NS,'use');u.setAttribute('href','#i-'+n);s.append(u);return s}
async function api(p,body){
  const r=await fetch(p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){location.reload();return null}
  const d=await r.json().catch(()=>({}));if(!r.ok){toast(d.errore||'Errore');return null}return d}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e} // solo textContent: nessun HTML iniettato
function btn(txt,cls,fn){const b=el('button',cls,txt);b.onclick=fn;return b}
let _tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',4000)}

/* ---- testo del modello: blocchi di codice, elenchi, **grassetto**, `codice` (solo DOM, mai innerHTML) */
function inline(p,txt){let g=false;txt.split(/(`[^`]+`|\*\*)/).forEach(s=>{
  if(s==='**'){g=!g;return}if(!s)return;
  const n=(s.length>2&&s.startsWith('`')&&s.endsWith('`'))?el('code','',s.slice(1,-1)):document.createTextNode(s);
  if(g){const w=el('b');w.append(n);p.append(w)}else p.append(n)})}
function md(txt){const f=document.createDocumentFragment();
  txt.split(/```[a-z]*\n?/).forEach((blocco,i)=>{
    if(i%2){f.append(el('pre','',blocco.replace(/\n$/,'')));return}
    let lista=null,tipoL='',ultimoLi=null;                       // lista corrente (continua anche dopo righe vuote)
    blocco.split(/\n/).forEach(riga=>{
      const li=riga.match(/^(\s*)(?:([*-])|(\d+)[.)])\s+(.*)$/);
      if(li){const ann=li[1].length>=2&&ultimoLi,t=li[2]?'ul':'ol';
        let dove=lista;
        if(ann){let sub=ultimoLi.querySelector(':scope>'+t);if(!sub){sub=el(t);ultimoLi.append(sub)}dove=sub}
        else if(!lista||tipoL!==t){lista=el(t);if(t==='ol'&&li[3])lista.start=+li[3];f.append(lista);tipoL=t;dove=lista}
        const x=el('li');inline(x,li[4]);dove.append(x);if(!ann)ultimoLi=x}
      else if(riga.trim()){lista=null;ultimoLi=null;const p=el('p');inline(p,riga.trim());
        const prev=f.lastChild;if(prev&&prev.tagName==='P'&&prev.dataset.cont){prev.append(document.createElement('br'),...p.childNodes)}else{p.dataset.cont='1';f.append(p)}}
      else{const prev=f.lastChild;if(prev&&prev.dataset)delete prev.dataset.cont}});}); 
  return f}

/* ---- righe di log -> passi leggibili */
function arg(a,k){const m=a.match(new RegExp('"'+k+'":\\s*"((?:[^"\\\\]|\\\\.)*)'));return m?m[1].replace(/\\n/g,' ').replace(/\\"/g,'"'):''}
function evento(riga){
  const m=riga.match(/^(\d\d:\d\d:\d\d) \[([^\]#]+?)(?: #\d+)?\] (.*)$/s);if(!m)return null;
  const [,ora,chi,resto]=m;const sotto=chi.includes('/')?chi.split('/').pop():'';
  const s=resto.match(/^strumento: (\w+)\((.*)\)$/s);
  if(s){const [,fn,a]=s;const D={run_shell:['Esegue ',arg(a,'command')],write_file:['Scrive ',arg(a,'path')],edit_file:['Modifica ',arg(a,'path')],read_file:['Legge ',arg(a,'path')],
      delete_file:['Cancella ',arg(a,'path')],list_dir:['Elenca ',arg(a,'path')||'il workspace'],web_search:['Cerca ',arg(a,'query')],fetch_url:['Legge ',arg(a,'url')],delega_agenti:['Delega a sotto-agenti',''],
      git:['Git ',arg(a,'azione')],screenshot:['Cattura lo schermo',''],finestre:['Elenca le finestre aperte',''],stato_pc:['Controlla lo stato del PC',''],apri:['Apre ',arg(a,'destinazione')],controlla_input:['Input: ',(arg(a,'azione')+' '+(arg(a,'testo')||arg(a,'tasti')||'')).trim()]};
    const d=D[fn]||[fn,''];return {sotto,i:ICN[fn]||'terminal',t:d[0],c:d[1]}}
  const sc=resto.match(/^screenshot: (scr-[\d-]+\.jpg)$/);if(sc)return {sotto,i:'image',t:'Schermo catturato',img:sc[1]};
  if(/^avviato:/.test(resto))return {sotto,i:'users',t:'Sotto-agente avviato: '+resto.slice(9)};
  if(resto==='finito')return {sotto,i:'check',t:'Sotto-agente finito'};
  if(/^errore \d+/.test(resto))return {sotto,i:'alert',t:'Servizio occupato, riprovo ('+resto.replace(/^errore (\d+).*\((\d+\/\d+)\)$/,'$1 · tentativo $2')+')'};
  if(/quota giornaliera|passo a/.test(resto))return {sotto,i:'alert',t:resto};
  return {sotto,i:'msg',t:resto,say:true}}
const passi=log=>log.filter(l=>!/^\S+ [▶■]/.test(l)).map(evento).filter(Boolean);
function segmenti(log){const out=[];log.forEach(l=>{if(/^\S+ ▶ /.test(l))out.push([]);else if(out.length)out[out.length-1].push(l)});return out}

/* ---- stato */
let STATO=null,SESS=[],sel=null,vista='chat',ruolo='generico',modo=null,aperti=new Set(),CACHE={},vibrato=0,sigThread='',sigLista='',FILEOPEN=null;
const scelta=r=>r&&r.t==='run'?(STATO?.runs||[]).find(x=>x.id===r.id):null;
const classe=r=>r.conferme.length?'att':r.attivo?'run':({finito:'ok',errore:'err','quota finita':'err',fermato:'err'}[r.stato]||'ok');
function titolo(s,n=70){s=s.replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s}
function quando(t){const d=new Date(t*1000),o=new Date();return d.toDateString()===o.toDateString()?d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}

function gruppo(t){const g=Math.floor((new Date().setHours(0,0,0,0)-new Date(t*1000).setHours(0,0,0,0))/864e5);return g<=0?'Oggi':g===1?'Ieri':g<8?'Ultimi 7 giorni':'Più vecchie'}
function renderLista(){
  const runs=STATO?STATO.runs:[],sids=new Set(runs.map(r=>r.sid));
  const old=SESS.filter(s=>!sids.has(s.sid));
  const sig=JSON.stringify([runs.map(r=>[r.id,r.stato,r.conferme.length,r.attivo,r.obiettivo]),old.map(s=>s.sid),sel,vista]);
  if(sig===sigLista)return;sigLista=sig;
  const box=$('#lista');box.replaceChildren();
  const voce=(on,cls,t,fn,sid)=>{const d=el('div','it'+(on&&vista==='chat'?' on':''));d.tabIndex=0;d.append(el('span','st '+(cls||'vuoto')),el('span','t',t));
    d.onclick=fn;d.onkeydown=e=>{if(e.key==='Enter')fn()};if(sid)d.append(cestino(sid));box.append(d)};
  if(runs.length){box.append(el('div','sez','Recenti'));
    runs.forEach(r=>voce(sel&&sel.t==='run'&&sel.id===r.id,classe(r)==='ok'?'':classe(r),titolo(r.turni[0]?.q||r.obiettivo),()=>apri({t:'run',id:r.id}),r.attivo?null:r.sid))}
  if(old.length){const sz=el('div','sez');sz.append(el('span','','Cronologia'));const sv=el('button','','Svuota');
    sv.onclick=e=>{e.stopPropagation();if(sv.dataset.ok){elimina({tutte_vecchie:true})}else{sv.dataset.ok=1;sv.textContent='Sicuro? Elimina tutte';setTimeout(()=>{delete sv.dataset.ok;sv.textContent='Svuota'},3500)}};sz.append(sv);box.append(sz);
    let gr='';old.forEach(s=>{const g=gruppo(s.quando);if(g!==gr){gr=g;box.append(el('div','sez sez2',g))}voce(sel&&sel.t==='sess'&&sel.sid===s.sid,'',titolo(s.titolo),()=>apri({t:'sess',sid:s.sid}),s.sid)})}
  if(!runs.length&&!old.length)box.append(el('div','vuoto','Nessuna conversazione'))}

function passiBox(lista,attivo,chiave){
  const open=aperti.has(chiave)||attivo,box=el('div','steps'+(open?' open':'')),h=el('div','h');
  if(attivo){h.append(el('span','spin'),document.createTextNode('Sta lavorando…'))}
  else{const c=ic('chev');c.classList.add('ch');h.append(c,document.createTextNode(lista.length===1?'1 azione':lista.length+' azioni'))}
  if(!attivo)h.onclick=()=>{aperti.has(chiave)?aperti.delete(chiave):aperti.add(chiave);sigThread='';renderThread()};
  box.append(h);
  if(open&&lista.length){const l=el('div','l');(attivo?lista.slice(-6):lista).forEach(e=>{const r=el('div','step'+(e.say?' say':''));r.append(ic(e.i));
    const t=el('span');if(e.sotto)t.append(el('span','s',e.sotto));t.append(document.createTextNode(e.t));if(e.c){t.append(el('code','',e.c))}if(e.img){const a=el('a','shot'),im=el('img');im.src='/api/screen/'+e.img;im.alt='Screenshot';im.loading='lazy';a.href=im.src;a.target='_blank';a.rel='noopener';a.append(im);t.append(a)}r.append(t);l.append(r)});box.append(l)}
  return box}
function turno(col,q,passiLista,risposta,attivo,chiave,stato,ver,all){
  if(all&&all.length){const w=el('div','ua');all.forEach(a=>{const u='/api/allegato/'+a.id;
    if(a.tipo==='immagine'){const l=el('a');l.href=u;l.target='_blank';l.rel='noopener';const im=el('img','att-img');im.src=u;im.alt=a.nome;im.loading='lazy';l.append(im);w.append(l)}
    else{const l=el('a','att-f');l.href=u;l.target='_blank';l.rel='noopener';l.append(ic('file'),document.createTextNode(a.nome));w.append(l)}});
    if(q)w.append(el('div','u',q));col.append(w)}
  else col.append(el('div','u',q));
  if(passiLista.length||attivo)col.append(passiBox(passiLista,attivo,chiave));
  if(risposta){const a=el('div','a');
    if(['errore','quota finita'].includes(stato)){const b=el('div','err-box');b.append(md(risposta));a.append(b)}else a.append(md(risposta));
    const acts=el('div','acts'),cp=el('button');cp.append(ic('copy'),document.createTextNode('Copia'));cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(risposta);cp.lastChild.textContent='Copiato'};
    const fl=el('button');fl.append(ic('folder'),document.createTextNode('Vedi file creati'));fl.onclick=()=>vai('file');const sp=el('button');sp.append(ic('speaker'),document.createTextNode('Ascolta'));sp.onclick=()=>leggiAVoce(risposta);acts.append(cp,sp,fl);a.append(acts);if(ver)a.append(badge(ver));col.append(a)}}
function badge(v){const ok=v.ok,av=(v.avvisi||[]).length,er=(v.errori||[]).length;
  const b=el('div','ver '+(!ok?'no':av?'warn':'ok'));const h=el('div','vh');
  h.append(ic(ok?'check':'alert'),document.createTextNode(!ok?'Non verificato: la risposta contiene affermazioni smentite dai fatti':av?'Verificato, con '+av+(av===1?' avviso':' avvisi'):'Verificato dal sistema: azioni e file controllati'));b.append(h);
  [...(v.errori||[]),...(v.avvisi||[])].forEach(x=>b.append(el('div','vd',x)));return b}
function benvenuto(col){
  const h=el('div','hello');h.append(el('h1','','Cosa devo fare?'),el('p','','Un agente che lavora sul tuo PC: legge e scrive file, esegue comandi e cerca sul web.'));
  const g=el('div','ex');ESEMPI.forEach(([i,x])=>{const b=el('button');b.append(ic(i),document.createTextNode(x));b.onclick=()=>{$('#ob').value=x;$('#ob').focus();crescita()};g.append(b)});
  h.append(g);col.append(h)}
function renderThread(){
  const col=$('#col');let sig,build;const r=scelta(sel);
  if(!sel){sig='nuovo';build=()=>benvenuto(col)}
  else if(r){sig=JSON.stringify([r.id,r.turni,r.log.length,r.log[r.log.length-1],r.stato,r.attivo,[...aperti]]);
    build=()=>{const seg=segmenti(r.log);r.turni.forEach((t,i)=>{const ult=i===r.turni.length-1;turno(col,t.q,passi(seg[i]||[]),t.a,ult&&r.attivo,r.id+i,r.stato,t.verifica,t.allegati)})}}
  else if(sel.t==='sess'){const d=CACHE[sel.sid];if(!d){sig='carica';build=()=>col.append(el('div','vuoto','Carico la conversazione…'))}
    else{sig='s'+sel.sid+[...aperti];build=()=>d.turni.forEach((t,i)=>turno(col,t.q,passi(t.log),t.a,false,sel.sid+i,'finito'))}}
  else{sig='x';build=()=>col.append(el('div','vuoto','Conversazione non più disponibile'))}
  if(sig===sigThread)return;sigThread=sig;
  const th=$('#thread'),giu=th.scrollTop+th.clientHeight>=th.scrollHeight-80;
  col.replaceChildren();build();if(giu||!sel)th.scrollTop=th.scrollHeight}
function renderTop(){
  const r=scelta(sel),st=$('#stato');
  $('#ttl').textContent=vista==='consumi'?'Consumi':vista==='file'?'File':vista==='registro'?'Registro':r?titolo(r.turni[0]?.q||r.obiettivo,90):sel&&sel.t==='sess'?titolo((SESS.find(s=>s.sid===sel.sid)||{}).titolo||'Conversazione',90):'Nuova conversazione';
  if(vista==='chat'&&r){const c=classe(r);st.style.display='';st.className='chip '+(c==='run'?'':c);st.textContent=r.conferme.length?'In attesa di conferma':r.attivo?'Al lavoro':r.stato.charAt(0).toUpperCase()+r.stato.slice(1)}else st.style.display='none'}
function renderComposer(){
  const r=scelta(sel),att=!!(r&&r.attivo),nuovo=!sel,v=$('#ob').value.trim();
  $('#ob').disabled=att;
  const b=$('#vai');b.replaceChildren(ic(att?'stop':'up'));const pronti=ALL.filter(a=>a.stato==='ok').length,carico=ALL.some(a=>a.stato==='carico');b.disabled=att?false:(!(v||pronti)||carico);b.title=att?'Ferma':'Invia';b.classList.toggle('stop',att);
  $('#ob').placeholder=att?"L'agente sta lavorando…":nuovo?"Scrivi o parla…":'Scrivi o parla…';
  $('#ruolo').style.display=nuovo||(sel&&sel.t==='sess')?'':'none';
  if(r&&r.modo&&document.activeElement!==$('#modo')&&$('#modo').dataset.run!==r.id){$('#modo').value=r.modo;$('#modo').dataset.run=r.id}
  $('#cartella').disabled=!!r;if(r&&$('#cartella').options.length)$('#cartella').value=r.cartella||'';
  $('#hint').textContent=DESCMODO[$('#modo').value]||'';$('#ruolo').title=DESC[ruolo]||''}
function sheet(){
  const lista=[];(STATO?.runs||[]).forEach(r=>r.conferme.forEach(k=>lista.push({r,k})));
  document.title=(lista.length?`(${lista.length}) Conferma · `:'')+'Gemini agent';
  const sh=$('#sheet');sh.style.display=lista.length?'block':'none';if(!lista.length){vibrato=0;return}

/* ---- consumi */
const nf=n=>Number(n).toLocaleString('it-IT');
function tra(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' h '+m+' min':m+' min'}
function ns(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}
function bello(m){const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
let TABELLA=false;
function grafico(st){
  const W=560,H=120,pl=36,pb=22,pt=8,n=st.length,gap=(W-pl)/n,bw=Math.min(26,gap*.5),mx=bello(Math.max(...st.map(x=>x.richieste),4));
  const wrap=el('div','tipbox'),tip=el('div','tip'),svg=ns('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':'Richieste negli ultimi 7 giorni'});
  [0,.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);svg.append(ns('line',{x1:pl,x2:W,y1:y,y2:y,class:'gl'}));const t=ns('text',{x:pl-8,y:y+4,class:'tick'});t.textContent=nf(Math.round(mx*f));svg.append(t)});
  st.forEach((x,i)=>{const h=(H-pt-pb)*x.richieste/mx,xx=pl+gap*i+(gap-bw)/2,g=ns('g',{});
    g.append(ns('rect',{x:xx-(gap-bw)/2,y:pt,width:gap,height:H-pt-pb,class:'hit'}));
    g.append(ns('rect',{x:xx,y:H-pb-Math.max(h,1.5),width:bw,height:Math.max(h,1.5),rx:3,class:'bar-i'+(i===n-1?' oggi':''),opacity:x.richieste?1:.35}));
    const d=new Date(x.giorno+'T12:00:00'),t=ns('text',{x:xx+bw/2,y:H-6,'text-anchor':'middle'});t.textContent=d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric'}).replace('.','');g.append(t);
    g.addEventListener('mouseenter',()=>{tip.textContent=d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' · '+nf(x.richieste)+' richieste';tip.style.display='block';tip.style.left=Math.min(Math.max(xx/W*100,12),80)+'%';tip.style.top='0'});
    g.addEventListener('mouseleave',()=>tip.style.display='none');svg.append(g)});
  wrap.append(svg,tip);return wrap}
function tabellaStorica(st){const t=el('table','tab');const th=el('tr');['Giorno','Richieste'].forEach(x=>th.append(el('th','',x)));t.append(th);
  st.slice().reverse().forEach(x=>{const r=el('tr');r.append(el('td','',new Date(x.giorno+'T12:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})),el('td','num',nf(x.richieste)));t.append(r)});return t}
function disegnaConsumi(d){
  const c=$('#cons');c.replaceChildren();
  c.append(el('p','lead','Richieste di oggi per modello. Le quote gratuite di Google si azzerano una volta al giorno.'));
  const rs=new Date(d.reset*1000),s1=el('div','sec'),rr=el('div','reset');
  const big=el('span','big num',tra(d.reset-Date.now()/1000));
  rr.append(big,el('span','mut','al prossimo azzeramento · alle '+rs.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+' (mezzanotte nel Pacifico)'));s1.append(rr);c.append(s1);
  const s2=el('div','sec'),h2=el('div','sh2');h2.append(el('span','','Modelli'),el('span','mut3 num',d.rpm?d.rpm+' richieste/min consentite dall\'app':''));s2.append(h2);
  const hd=el('div','tr head');['Modello','Oggi','Utilizzo','Stato'].forEach((x,i)=>hd.append(el('span',i===3?'num2 stato':i===1?'num2':'',x)));s2.append(hd);
  d.modelli.forEach(m=>{const r=el('div','tr'),n=el('span','nome',m.nome);
    const sot=[m.rpm?m.rpm+' al minuto':'',m.tpm?nf(m.tpm)+' token al minuto':'',(m.tok_in+m.tok_out)?nf(m.tok_in+m.tok_out)+' token oggi':''].filter(Boolean).join(' · ');if(sot)n.append(el('span','sotto',sot));
    const q=el('span','num num2',m.limite?nf(m.richieste)+' / '+nf(m.limite):nf(m.richieste)),me=el('div','meter'+(m.limite&&m.richieste>=m.limite?' pieno':m.limite&&m.richieste>=m.limite*.8?' alto':''));
    const i=el('i');i.style.width=m.limite?Math.min(100,m.richieste/m.limite*100)+'%':'0%';me.append(i);
    const st=el('span','stato '+(m.esaurito||(m.limite&&m.richieste>=m.limite)?'no':'')),fin=m.esaurito||(m.limite&&m.richieste>=m.limite);
    st.append(ic(fin?'x':'check'),document.createTextNode(fin?'Finita':m.limite?'Disponibile':'Nessun limite impostato'));
    r.append(n,q,me,st);s2.append(r)});c.append(s2);
  const s3=el('div','sec'),h3=el('div','sh2'),tot=d.storia.reduce((a,x)=>a+x.richieste,0);
  h3.append(el('span','','Ultimi 7 giorni · '+nf(tot)+' richieste'));const tb=btn(TABELLA?'Grafico':'Tabella','btn',()=>{TABELLA=!TABELLA;disegnaConsumi(d)});h3.append(tb);s3.append(h3);
  s3.append(TABELLA?tabellaStorica(d.storia):grafico(d.storia));if(d.storia.filter(x=>x.richieste).length<=1)s3.append(el('div','nota','Per ora solo oggi ha dati: il contatore è nato oggi.'));c.append(s3);
  const s4=el('div','sec'),h4=el('div','sh2');h4.append(el('span','','Modelli di riserva'));s4.append(h4);
  d.provider.forEach(p=>{const r=el('div','rig'),l=el('div');l.append(el('div','',p.nome),el('div','d',p.modello+(p.locale?' · sul tuo PC':'')));
    const st=el('span','stato '+(p.attivo?'ok':''));if(p.attivo)st.append(ic('check'));st.append(document.createTextNode(p.attivo?'Attivo':'Non configurato'));if(!p.attivo)st.style.color='var(--tx3)';r.append(l,st);s4.append(r)});c.append(s4);
  c.append(el('div','nota','I limiti sono impostati a mano: Google non permette di leggerli in automatico. Il conteggio di Google include anche le richieste fallite.'))}
async function caricaConsumi(){if(vista!=='consumi')return;const d=await api('/api/consumi');if(d&&vista==='consumi'){const th=$('#v-consumi .pag');const y=th.scrollTop;disegnaConsumi(d);th.scrollTop=y}}

const DET={run_shell:'command',write_file:'path',edit_file:'path',read_file:'path',delete_file:'path',list_dir:'path',web_search:'query',fetch_url:'url',apri:'destinazione',git:'azione',controlla_input:'azione'};
async function caricaRegistro(){if(vista!=='registro')return;const d=await api('/api/registro?n=300');if(!d||vista!=='registro')return;
  const c=$('#reg');c.replaceChildren();c.append(el('p','lead','Tutto quello che gli agenti hanno fatto sul PC, dal più recente. I segreti sono oscurati.'));

  d.righe.forEach(r=>{let a={};try{a=JSON.parse(r.args)}catch(_){}const det=a[DET[r.strumento]]||(typeof a==='object'?Object.values(a).filter(x=>typeof x==='string').join(' '):'')||'';

    row.append(el('span','t num',when.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+(when.toDateString()===new Date().toDateString()?'':' '+when.toLocaleDateString('it-IT',{day:'numeric',month:'short'}))),

/* ---- voce: registra -> /api/voce -> testo nella casella; lettura a voce delle risposte */
let REC=null,CH=[],TIM=null,VOCE_AUTO=false;
let ALL=[];                  // allegati del messaggio in preparazione
try{VOCE_AUTO=localStorage.getItem('voce_auto')==='1'}catch(_){}
function aggiornaVoce(){$('#t-voce').textContent=VOCE_AUTO?'Voce: invia subito':'Voce: scrivi prima'}
function statoMic(on){const m=$('#mic');m.classList.toggle('rec',on);m.replaceChildren(ic(on?'stop':'mic'));m.title=on?'Tocca per fermare':'Parla (registra un messaggio vocale)'}
async function microfono(){
  if(REC){REC.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("Questo browser non puo' registrare (serve HTTPS)");return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Microfono non consentito: abilitalo per questo sito nelle impostazioni del browser');return}
  const tipo=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  REC=new MediaRecorder(stream,tipo?{mimeType:tipo}:{});CH=[];const t0=Date.now();
  REC.ondataavailable=e=>{if(e.data.size)CH.push(e.data)};
  REC.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(TIM);const blob=new Blob(CH,{type:(REC&&REC.mimeType)||tipo});REC=null;statoMic(false);
    if(blob.size<1500){toast('Registrazione troppo breve');return}
    $('#mic').disabled=true;toast('Trascrivo…');
    let d={},ok=false;try{const r=await fetch('/api/voce',{method:'POST',headers:{'X-Requested-With':'gemini-agent'},body:blob});ok=r.ok;d=await r.json().catch(()=>({}))}catch(_){d={errore:'Connessione assente'}}
    $('#mic').disabled=false;
    if(!ok){toast(d.errore||'Errore');return}
    if(!d.testo){toast('Non ho sentito parole');return}
    const ob=$('#ob');ob.value=(ob.value.trim()?ob.value.trim()+' ':'')+d.testo;crescita();ob.focus();toast('Trascritto');if(VOCE_AUTO)invia()};
  REC.start();statoMic(true);TIM=setInterval(()=>{if(Date.now()-t0>110000&&REC)REC.stop()},500)}
$('#mic').onclick=microfono;
$('#n-voce').onclick=()=>{VOCE_AUTO=!VOCE_AUTO;try{localStorage.setItem('voce_auto',VOCE_AUTO?'1':'0')}catch(_){}aggiornaVoce();toast(VOCE_AUTO?'Dopo la voce il messaggio parte da solo':'Dopo la voce il testo resta nella casella')};aggiornaVoce();
function leggiAVoce(testo){if(!window.speechSynthesis)return;if(speechSynthesis.speaking){speechSynthesis.cancel();return}
  const u=new SpeechSynthesisUtterance(testo.replace(/```[\s\S]*?```/g,' codice omesso. ').replace(/[`*#_]/g,''));u.lang='it-IT';
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('it'));if(v)u.voice=v;speechSynthesis.speak(u)}

const MAX_ALL=5;
function disegnaAll(){const c=$('#alleg');c.replaceChildren();ALL.forEach(a=>{const ch=el('div','ch'+(a.stato==='carico'?' carico':''));
  if(a.tipo==='immagine'&&a.id){const im=el('img');im.src='/api/allegato/'+a.id;im.alt='';ch.append(im)}else ch.append(ic(a.tipo==='pdf'||a.tipo==='testo'?'file':'file'));
  ch.append(el('span','n',a.stato==='carico'?'Carico… '+a.nome:a.nome));const x=el('button','x','×');x.title='Rimuovi';x.onclick=()=>{ALL=ALL.filter(z=>z!==a);disegnaAll();renderComposer()};ch.append(x);c.append(ch)})}
async function allega(file){
  if(ALL.length>=MAX_ALL){toast('Massimo '+MAX_ALL+' allegati per messaggio');return}
  if(file.size>10*1024*1024){toast('"'+file.name+'" supera i 10 MB');return}
  const a={nome:file.name||'incollato',tipo:'',stato:'carico'};ALL.push(a);disegnaAll();renderComposer();
  let ok=false,d={};try{const r=await fetch('/api/allegato',{method:'POST',headers:{'X-Requested-With':'gemini-agent','X-Nome':encodeURIComponent(a.nome)},body:file});ok=r.ok;d=await r.json().catch(()=>({}))}catch(_){d={errore:'Connessione assente'}}
  if(!ok){ALL=ALL.filter(z=>z!==a);toast(d.errore||'Errore nel caricamento')}else{Object.assign(a,d);a.stato='ok'}
  disegnaAll();renderComposer()}
